<header class="navbar">
  <a routerLink="/students" class="brand" (click)="closeMenus()">
    <span class="brand-logo">SM</span>
    <span class="brand-name">Student Manager</span>
  </a>

  <button class="burger" (click)="toggleMenu()" aria-label="Open menu">☰</button>

  <nav class="links" [class.open]="menuOpen()">
    <a routerLink="/students" routerLinkActive="active" (click)="closeMenus()">Students</a>

    @if (auth.isAdmin()) {
      <a routerLink="/admin/users" routerLinkActive="active" (click)="closeMenus()">Managers</a>
      <a routerLink="/admin/audit-logs" routerLinkActive="active" (click)="closeMenus()">Audit Logs</a>
    }
  </nav>

  <div class="actions">
    <button class="icon-btn" (click)="theme.toggle()" aria-label="Toggle theme">
      {{ theme.isDark() ? '☀️' : '🌙' }}
    </button>

    <div class="user">
      <button class="user-btn" (click)="userMenuOpen.set(!userMenuOpen())">
        {{ auth.user()?.fullName }} <small>({{ auth.user()?.role }})</small> ▾
      </button>

      @if (userMenuOpen()) {
        <div class="dropdown">
          <button (click)="logout()">Logout</button>
        </div>
      }
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
